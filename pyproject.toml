[project]
name = "compass"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44.0",
    "langfuse>=4.15.4",
    "pydantic-ai>=2.43.0",
    "python-dotenv>=1.2.3",
]

[build-system]
